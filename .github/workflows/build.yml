name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [all, linux, windows]
        default: all

permissions:
  contents: write

env:
  CURA_VERSION: 5.13.0
  CONAN_OPTIONS: >-
    -s build_type=Release -s compiler.cppstd=20
    -o "curaengine/*:enable_plugins=True" -o "curaengine/*:enable_arcus=True"
    -c tools.build:skip_test=True

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      # Same compiler family as UltiMaker's own Linux builds (GCC 13 on Ubuntu 22.04), so the binary runs on the same systems.
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build patchelf
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan and UltiMaker's Conan config
        run: |
          pip install "conan>=2.7,<3"
          conan config install https://github.com/ultimaker/conan-config.git
          conan profile detect --force

      - name: Restore Conan cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.conan2/p
          key: conan-linux-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-${{ github.run_id }}
          restore-keys: conan-linux-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-

      - name: Build CuraEngine
        working-directory: curaengine
        run: conan build . --build=missing -pr:h=cura_build.jinja -pr:b=cura_build.jinja $CONAN_OPTIONS -of out

      # Saved even when the build fails, so a retry does not start from zero.
      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.conan2/p
          key: conan-linux-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-${{ github.run_id }}

      - name: Package
        run: |
          BIN=$(find curaengine/out -type f -name CuraEngine | head -1)
          echo "Built: $BIN"
          scripts/package-linux.sh "$BIN" "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64"

      - name: Wall order test (packaged engine)
        run: python3 tests/test_wall_order.py "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64/engine/CuraEngine"

      - name: Arc fitting test (packaged engine)
        run: python3 tests/test_arcs.py "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64/engine/CuraEngine"

      - name: Bone infill test (packaged engine)
        run: python3 tests/test_bone_infill.py "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64/engine/CuraEngine"

      - name: Installer test (fake Cura settings folder)
        run: tests/test_installer.sh "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64"

      - name: Create archive
        run: |
          cd dist
          tar -czf "cura-inner-outer-inner-$CURA_VERSION-linux-x86_64.tar.gz" "cura-inner-outer-inner-$CURA_VERSION-linux-x86_64"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CONAN_HOME: C:\cn
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan and UltiMaker's Conan config
        shell: bash
        run: |
          pip install "conan>=2.7,<3"
          conan config install https://github.com/ultimaker/conan-config.git
          conan profile detect --force

      - name: Restore Conan cache
        uses: actions/cache/restore@v6
        with:
          path: C:\cn\p
          key: conan-windows-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-${{ github.run_id }}
          restore-keys: conan-windows-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-

      - name: Build CuraEngine
        shell: bash
        working-directory: curaengine
        run: conan build . --build=missing -pr:h=cura_build.jinja -pr:b=cura_build.jinja $CONAN_OPTIONS -of out

      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: C:\cn\p
          key: conan-windows-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-${{ github.run_id }}

      - name: Package
        shell: pwsh
        run: |
          $exe = (Get-ChildItem curaengine\out -Recurse -Filter CuraEngine.exe | Select-Object -First 1).FullName
          Write-Host "Built: $exe"
          ./scripts/package-windows.ps1 -Exe $exe -Out "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64"

      - name: Wall order test (packaged engine)
        shell: pwsh
        run: python tests/test_wall_order.py "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64\engine\CuraEngine.exe"

      - name: Arc fitting test (packaged engine)
        shell: pwsh
        run: python tests/test_arcs.py "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64\engine\CuraEngine.exe"

      - name: Bone infill test (packaged engine)
        shell: pwsh
        run: python tests/test_bone_infill.py "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64\engine\CuraEngine.exe"

      - name: Installer test (fake Cura settings folder)
        shell: powershell
        run: .\tests\test_installer.ps1 -Package "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64"

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64" -DestinationPath "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.platform == 'all')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: List the assets
        run: ls -la assets
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: RELEASE_NOTES.md
          files: assets/*
