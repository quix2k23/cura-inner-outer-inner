name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [all, linux, windows]
        default: all

permissions:
  contents: write

env:
  CURA_VERSION: 5.14.0
  CONAN_OPTIONS: >-
    -s build_type=Release -s compiler.cppstd=20
    -o curaengine/*:enable_plugins=True -o curaengine/*:enable_arcus=True -o hwloc/*:shared=True
    -c tools.build:skip_test=True

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      # Same compiler family as UltiMaker's own Linux builds (GCC 13 on Ubuntu 22.04), so the binary runs on the same systems.
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build patchelf
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan and UltiMaker's Conan config
        run: |
          pip install "conan>=2.7,<3"
          conan config install https://github.com/ultimaker/conan-config.git
          conan profile detect --force

      - name: Restore Conan cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.conan2/p
          key: conan-linux-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-${{ github.run_id }}
          restore-keys: conan-linux-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-

      - name: Check that the Conan options take effect
        working-directory: curaengine
        run: |
          set -f
          conan graph info . -pr:h=cura_build.jinja -pr:b=cura_build.jinja $CONAN_OPTIONS --format=json > ../conan-graph.json
          python3 ../scripts/check-conan-options.py ../conan-graph.json $CONAN_OPTIONS

      # UltiMaker's libArcus aborts CuraEngine at exit when Cura closed the connection first; build a patched copy
      # (https://github.com/Ultimaker/libArcus/pull/168). The script fails if the engine would not use it.
      - name: Patch libArcus (exit crash)
        run: set -f; python3 scripts/patch-arcus.py ../arcus-src -pr:h=cura_build.jinja -pr:b=cura_build.jinja $CONAN_OPTIONS

      - name: Build CuraEngine
        working-directory: curaengine
        # $CONAN_OPTIONS is split into words unquoted, so it must not contain quote characters (Conan would get them
        # literally and silently ignore the option); set -f stops the shell from expanding the * patterns.
        run: set -f; conan build . --build=missing -pr:h=cura_build.jinja -pr:b=cura_build.jinja $CONAN_OPTIONS -of out

      # Saved even when the build fails, so a retry does not start from zero.
      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.conan2/p
          key: conan-linux-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-${{ github.run_id }}

      - name: Package
        run: |
          BIN=$(find curaengine/out -type f -name CuraEngine | head -1)
          echo "Built: $BIN"
          # The exact library folders of this build, so an older arcus etc. in the restored cache is not bundled.
          source "$(find curaengine/out -name conanrun.sh | head -1)"
          scripts/package-linux.sh "$BIN" "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64"

      - name: Wall order test (packaged engine)
        run: python3 tests/test_wall_order.py "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64/engine/CuraEngine"

      - name: Arc fitting test (packaged engine)
        run: python3 tests/test_arcs.py "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64/engine/CuraEngine"

      - name: Bone infill test (packaged engine)
        run: python3 tests/test_bone_infill.py "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64/engine/CuraEngine"

      - name: Layer change retraction test
        run: python3 tests/test_layer_change_retract.py "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64/engine/CuraEngine"

      - name: libArcus exit-crash test (packaged library)
        run: |
          LIB="dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64/engine/lib"
          g++ -std=c++20 -I ../arcus-src/include tests/arcus_close_join.cpp -L "$LIB" -lArcus -pthread -o arcus_close_join
          LD_LIBRARY_PATH="$LIB" timeout 60 ./arcus_close_join

      - name: Installer test (fake Cura settings folder)
        run: tests/test_installer.sh "dist/cura-inner-outer-inner-$CURA_VERSION-linux-x86_64"

      - name: Create archive
        run: |
          cd dist
          tar -czf "cura-inner-outer-inner-$CURA_VERSION-linux-x86_64.tar.gz" "cura-inner-outer-inner-$CURA_VERSION-linux-x86_64"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CONAN_HOME: C:\cn
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan and UltiMaker's Conan config
        shell: bash
        run: |
          pip install "conan>=2.7,<3"
          conan config install https://github.com/ultimaker/conan-config.git
          conan profile detect --force

      - name: Restore Conan cache
        uses: actions/cache/restore@v6
        with:
          path: C:\cn\p
          key: conan-windows-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-${{ github.run_id }}
          restore-keys: conan-windows-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-

      - name: Check that the Conan options take effect
        shell: bash
        working-directory: curaengine
        run: |
          set -f
          conan graph info . -pr:h=cura_build.jinja -pr:b=cura_build.jinja $CONAN_OPTIONS --format=json > ../conan-graph.json
          python ../scripts/check-conan-options.py ../conan-graph.json $CONAN_OPTIONS

      - name: Patch libArcus (exit crash)
        shell: bash
        run: set -f; python scripts/patch-arcus.py ../arcus-src -pr:h=cura_build.jinja -pr:b=cura_build.jinja $CONAN_OPTIONS

      - name: Build CuraEngine
        shell: bash
        working-directory: curaengine
        # $CONAN_OPTIONS is split into words unquoted, so it must not contain quote characters (Conan would get them
        # literally and silently ignore the option); set -f stops the shell from expanding the * patterns.
        run: set -f; conan build . --build=missing -pr:h=cura_build.jinja -pr:b=cura_build.jinja $CONAN_OPTIONS -of out

      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: C:\cn\p
          key: conan-windows-${{ hashFiles('curaengine/conanfile.py', 'curaengine/conandata.yml') }}-${{ github.run_id }}

      - name: Package
        shell: pwsh
        run: |
          $exe = (Get-ChildItem curaengine\out -Recurse -Filter CuraEngine.exe | Select-Object -First 1).FullName
          Write-Host "Built: $exe"
          ./scripts/package-windows.ps1 -Exe $exe -Out "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64"

      - name: Wall order test (packaged engine)
        shell: pwsh
        run: python tests/test_wall_order.py "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64\engine\CuraEngine.exe"

      - name: Arc fitting test (packaged engine)
        shell: pwsh
        run: python tests/test_arcs.py "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64\engine\CuraEngine.exe"

      - name: Bone infill test (packaged engine)
        shell: pwsh
        run: python tests/test_bone_infill.py "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64\engine\CuraEngine.exe"

      - name: Layer change retraction test
        shell: pwsh
        run: python tests/test_layer_change_retract.py "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64\engine\CuraEngine.exe"

      - name: Installer test (fake Cura settings folder)
        shell: powershell
        run: .\tests\test_installer.ps1 -Package "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64"

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64" -DestinationPath "dist\cura-inner-outer-inner-$env:CURA_VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.platform == 'all')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: List the assets
        run: ls -la assets
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: RELEASE_NOTES.md
          files: assets/*
